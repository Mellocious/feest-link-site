<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feest</title>
  <meta name="description" content="The Digital OS for Food Vendors." />
  <meta property="og:title" content="Feest" />
  <meta property="og:description" content="The Digital OS for Food Vendors." />
  <meta property="og:image" content="/logo.png" />
  <link rel="icon" href="/logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --coral:   #F7715B;
      --dark:    #1A1A1A;
      --bg:      #FAFAFA;
      --muted:   #9E9E9E;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg);
      color: var(--dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 56px 24px 64px;
    }

    .wrap {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Avatar ── */
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      overflow: hidden;
      background: #fff;
      margin-bottom: 16px;
      /* keep logo inside a circle with a subtle warm ring */
      box-shadow: 0 0 0 3px #fff, 0 0 0 4.5px rgba(247,113,91,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeUp .45s ease both;
    }

    .avatar img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      mix-blend-mode: multiply;
    }

    /* ── Name & bio ── */
    .name {
      font-size: 20px;
      font-weight: 800;
      color: var(--dark);
      letter-spacing: -0.3px;
      animation: fadeUp .45s .06s ease both;
    }

    .bio {
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      margin-top: 6px;
      margin-bottom: 36px;
      animation: fadeUp .45s .10s ease both;
    }

    /* ── Buttons ── */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 56px;
      border-radius: 100px;
      text-decoration: none;
      font-family: 'Montserrat', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.1px;
      transition: transform .14s ease, filter .14s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active { transform: scale(0.97); }

    /* Filled coral — primary */
    .btn.filled {
      background: var(--coral);
      color: #fff;
    }
    .btn.filled:hover { filter: brightness(1.06); }

    /* Outline — secondary */
    .btn.outline {
      background: transparent;
      border: 2px solid var(--dark);
      color: var(--dark);
    }
    .btn.outline:hover { background: rgba(0,0,0,0.04); }

    /* Stagger entrance */
    .btn:nth-child(1) { animation: fadeUp .4s .14s ease both; }
    .btn:nth-child(2) { animation: fadeUp .4s .19s ease both; }
    .btn:nth-child(3) { animation: fadeUp .4s .24s ease both; }
    .btn:nth-child(4) { animation: fadeUp .4s .29s ease both; }
    .btn:nth-child(5) { animation: fadeUp .4s .34s ease both; }

    /* ── Divider ── */
    .divider {
      width: 40px;
      height: 1px;
      background: rgba(0,0,0,0.1);
      margin: 28px 0;
    }

    /* ── Footer ── */
    footer {
      font-size: 11px;
      color: var(--muted);
      font-weight: 500;
      text-align: center;
      animation: fadeUp .4s .40s ease both;
    }

    footer a { color: var(--coral); text-decoration: none; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 380px) {
      body { padding: 44px 20px 56px; }
      .btn { height: 52px; font-size: 14px; }
    }
  </style>
</head>
<body>
<div class="wrap">

  <div class="avatar">
    <img src="/logo.png" alt="Feest" />
  </div>

  <p class="bio">The Digital OS for Food Vendors</p>

  <div class="links">
    <a class="btn filled" href="https://usefeest.com" target="_blank" rel="noopener noreferrer">Visit our Website</a>
    <a class="btn filled" href="https://usefeest.com/blog" target="_blank" rel="noopener noreferrer">Read our Blog</a>
    <a class="btn outline" href="https://instagram.com/usefeest" target="_blank" rel="noopener noreferrer">Instagram</a>
    <a class="btn outline" href="https://x.com/usefeest" target="_blank" rel="noopener noreferrer">X (Twitter)</a>
    <a class="btn outline" href="https://linkedin.com/company/usefeest" target="_blank" rel="noopener noreferrer">LinkedIn</a>
  </div>

  <div class="divider"></div>

  <footer>© 2026 Feest · <a href="https://usefeest.com">usefeest.com</a></footer>

</div>
</body>
</html>
